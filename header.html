<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saketh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Importing Soria Font - Ensure the URL is correct or replace with your local path */
        @font-face {
            font-family: 'Soria';
            src: url('https://fonts.cdnfonts.com/s/16205/Soria-font.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        .font-soria {
            font-family: 'Soria', serif;
        }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        // This allows you to use 'font-soria' as a Tailwind class
                        soria: ['Soria', 'serif'],
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#EE6E4D',
                            hover: '#d15d3f',
                        },
                        dark: {
                            DEFAULT: '#20201F',
                            bg: '#20201F',
                            card: '#2a2a29',
                            gray: '#A0A0A0',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-white dark:bg-dark text-gray-800 dark:text-gray-200 transition-colors duration-300 min-h-screen pt-16">
    
    <header class="fixed top-0 right-0 left-0 z-50 flex justify-between items-center p-4 bg-white/80 dark:bg-dark/80 backdrop-blur-md shadow-md">
        <a href="#" class="font-soria text-black dark:text-primary text-3xl tracking-wide">
            SAKETH
        </a>

        <button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-dark-card hover:ring-2 ring-primary transition-all">
            <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 text-dark" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
            <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-primary" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
        </button>
    </header>

    <main class="p-8 text-center flex flex-col items-center justify-center min-h-[60vh]">
        <h1 class="font-soria text-6xl md:text-8xl font-bold mb-4">
            Hello, I'm <span class="text-primary">Saketh</span>
        </h1>
        <p class="max-w-md mx-auto text-dark-gray text-lg">
            <!-- This is a clean combination of the Black (#20201F) and Orange (#EE6E4D) palette with Soria Typography. -->
        </p>
    </main>

   <script src ="index.js"></script>
</body>
</html>
