<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @font-face {
            font-family: 'Soria';
            src: url('https://fonts.cdnfonts.com/s/16205/Soria-font.woff') format('woff');
            font-weight: normal; font-style: normal;
        }

        .font-soria { font-family: 'Soria', serif; }
        html { scroll-behavior: smooth; }

        /* Smoother Letter Reveal */
        .letter {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            filter: blur(5px);
            /* Using cubic-bezier for a more 'liquid' movement */
            animation: letter-reveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity, filter;
        }

        @keyframes letter-reveal {
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* 3D Box Styling */
        .nav-3d {
            box-shadow: 4px 4px 0px 0px #EE6E4D;
            transition: all 0.2s ease;
        }
        .nav-3d:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px #EE6E4D;
        }
        .nav-3d:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px #EE6E4D;
        }

        /* Mobile Menu */
        .mobile-menu {
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .mobile-menu.active { transform: translateX(0); }

        /* Hamburger Icon */
        .hamburger span {
            display: block; width: 25px; height: 3px;
            background-color: #EE6E4D; margin: 5px 0;
            transition: all 0.3s ease-in-out;
        }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(8px, 8px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(7px, -7px); }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { soria: ['Soria', 'serif'] },
                    colors: {
                        primary: { DEFAULT: '#EE6E4D', hover: '#d15d3f' },
                        dark: { DEFAULT: '#20201F', bg: '#20201F', card: '#2a2a29', gray: '#A0A0A0' }
                    }
                }
            }
        }
    </script>
</head>
